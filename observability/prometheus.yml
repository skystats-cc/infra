global:
  scrape_interval: 30s
scrape_configs:
  - job_name: skystats-api
    metrics_path: /metrics
    authorization:
      credentials_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ['api:3000']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
