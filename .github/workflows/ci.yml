name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid (all profiles)
        run: |
          cp .env.example .env
          DISCORD_TOKEN=x DISCORD_CLIENT_ID=x CLOUDFLARE_TUNNEL_TOKEN=x docker compose --profile tunnel --profile monitoring --profile observability config --quiet
          DISCORD_TOKEN=x DISCORD_CLIENT_ID=x docker compose -f docker-compose.yml -f docker-compose.staging.yml config --quiet
          mkdir -p ../server ../web ../discord-bot
          DISCORD_TOKEN=x DISCORD_CLIENT_ID=x docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
      - name: Shell scripts
        run: shellcheck -x scripts/*.sh

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
